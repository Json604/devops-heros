apiVersion: apps/v1
kind: Deployment
metadata: {name: web-app-clusterip}
spec:
  replicas: 3
  selector: {matchLabels: {app: web-clusterip}}
  template:
    metadata: {labels: {app: web-clusterip}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
