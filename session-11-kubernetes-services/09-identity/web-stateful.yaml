apiVersion: v1
kind: Service
metadata: {name: web-stateful}
spec:
  clusterIP: None
  selector: {app: web-stateful}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: web-stateful}
spec:
  serviceName: web-stateful
  replicas: 3
  selector: {matchLabels: {app: web-stateful}}
  template:
    metadata: {labels: {app: web-stateful}}
    spec:
      containers: [{name: web, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}]
