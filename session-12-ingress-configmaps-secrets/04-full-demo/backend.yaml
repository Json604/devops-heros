apiVersion: apps/v1
kind: Deployment
metadata: {name: yatri-backend, labels: {app: yatri-app, tier: backend}}
spec:
  replicas: 2
  selector: {matchLabels: {app: yatri-app, tier: backend}}
  template:
    metadata: {labels: {app: yatri-app, tier: backend}}
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "-c"]
          args:
            - "from http.server import BaseHTTPRequestHandler,HTTPServer; import os,json; Handler=type('Handler',(BaseHTTPRequestHandler,),{'do_GET':lambda self:(self.send_response(200),self.send_header('Content-Type','application/json'),self.end_headers(),self.wfile.write(json.dumps({k:v for k,v in os.environ.items() if k in ['ENVIRONMENT','LOG_LEVEL','DEFAULT_CURRENCY','POSTGRES_USER']}).encode()))}); HTTPServer(('0.0.0.0',8080),Handler).serve_forever()"
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: yatri-app-config}}]
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: yatri-db-secret, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: yatri-db-secret, key: POSTGRES_PASSWORD}}
---
apiVersion: v1
kind: Service
metadata: {name: yatri-backend, labels: {app: yatri-app, tier: backend}}
spec:
  selector: {app: yatri-app, tier: backend}
  ports: [{name: http, port: 8080, targetPort: 8080}]
