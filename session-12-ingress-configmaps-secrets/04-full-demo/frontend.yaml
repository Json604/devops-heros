apiVersion: apps/v1
kind: Deployment
metadata: {name: yatri-frontend, labels: {app: yatri-app, tier: frontend}}
spec:
  replicas: 2
  selector: {matchLabels: {app: yatri-app, tier: frontend}}
  template:
    metadata: {labels: {app: yatri-app, tier: frontend}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: yatri-frontend, labels: {app: yatri-app, tier: frontend}}
spec:
  selector: {app: yatri-app, tier: frontend}
  ports: [{name: http, port: 80, targetPort: 80}]
