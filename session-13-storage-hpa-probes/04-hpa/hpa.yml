apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: cpu-demo}
  template:
    metadata:
      labels: {app: cpu-demo}
    spec:
      containers:
      - name: php
        image: registry.k8s.io/hpa-example
        ports: [{containerPort: 80}]
        resources:
          requests: {cpu: 100m, memory: 32Mi}
          limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: cpu-demo}
spec:
  selector: {app: cpu-demo}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: cpu-demo}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cpu-demo}
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleDown: {stabilizationWindowSeconds: 60}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 50}
