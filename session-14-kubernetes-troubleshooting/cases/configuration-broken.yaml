apiVersion: v1
kind: Pod
metadata:
  name: configuration
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - echo healthy; sleep 3600
    env:
    - name: SETTING
      valueFrom:
        configMapKeyRef:
          name: missing-env-config
          key: mode
