apiVersion: apps/v1
kind: Deployment
metadata: {name: app-rolling}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: app-rolling}}
  template:
    metadata: {labels: {app: app-rolling}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          env: [{name: VERSION, value: "v1"}]
