apiVersion: v1
kind: ConfigMap
metadata: {name: app-green-page}
data:
  index.html: "<html><body><p>GREEN v2</p></body></html>"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app-green}
spec:
  replicas: 3
  selector: {matchLabels: {app: myapp, slot: green}}
  template:
    metadata: {labels: {app: myapp, slot: green}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts: [{name: page, mountPath: /usr/share/nginx/html, readOnly: true}]
      volumes: [{name: page, configMap: {name: app-green-page}}]
