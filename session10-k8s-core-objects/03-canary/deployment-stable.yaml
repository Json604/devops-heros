apiVersion: v1
kind: ConfigMap
metadata: {name: stable-page}
data:
  index.html: "<html><body><p>STABLE v1</p></body></html>"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app-stable}
spec:
  replicas: 9
  selector: {matchLabels: {app: myapp-canary, track: stable}}
  template:
    metadata: {labels: {app: myapp-canary, track: stable}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts: [{name: page, mountPath: /usr/share/nginx/html, readOnly: true}]
      volumes: [{name: page, configMap: {name: stable-page}}]
