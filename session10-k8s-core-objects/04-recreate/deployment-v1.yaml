apiVersion: v1
kind: ConfigMap
metadata: {name: recreate-v1-page}
data:
  index.html: "<html><body><p>VERSION: v1</p></body></html>"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app-recreate}
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector: {matchLabels: {app: app-recreate}}
  template:
    metadata: {labels: {app: app-recreate}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts: [{name: page, mountPath: /usr/share/nginx/html, readOnly: true}]
      volumes: [{name: page, configMap: {name: recreate-v1-page}}]
