apiVersion: v1
kind: Pod
metadata: {name: lifecycle-readiness, labels: {app: lifecycle}}
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports: [{containerPort: 80}]
      readinessProbe:
        httpGet: {path: /, port: 80}
        initialDelaySeconds: 15
        periodSeconds: 5
