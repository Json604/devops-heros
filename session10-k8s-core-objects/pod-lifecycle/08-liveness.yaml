apiVersion: v1
kind: Pod
metadata: {name: lifecycle-liveness, labels: {app: lifecycle}}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      livenessProbe:
        exec: {command: ["sh", "-c", "exit 1"]}
        initialDelaySeconds: 5
        periodSeconds: 2
        failureThreshold: 2
