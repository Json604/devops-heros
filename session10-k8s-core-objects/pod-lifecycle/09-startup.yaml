apiVersion: v1
kind: Pod
metadata: {name: lifecycle-startup, labels: {app: lifecycle}}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 8; touch /tmp/started; sleep 3600"]
      startupProbe:
        exec: {command: ["sh", "-c", "test -f /tmp/started"]}
        periodSeconds: 2
        failureThreshold: 15
      livenessProbe:
        exec: {command: ["sh", "-c", "test -f /tmp/started"]}
        periodSeconds: 3
