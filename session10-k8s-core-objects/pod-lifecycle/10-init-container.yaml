apiVersion: v1
kind: Pod
metadata: {name: lifecycle-init, labels: {app: lifecycle}}
spec:
  initContainers:
    - name: setup
      image: busybox:1.36
      command: ["sh", "-c", "echo setup-complete; sleep 2"]
  containers:
    - name: app
      image: nginx:1.27-alpine
      ports: [{containerPort: 80}]
