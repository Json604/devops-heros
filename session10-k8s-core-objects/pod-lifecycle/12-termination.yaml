apiVersion: v1
kind: Pod
metadata: {name: lifecycle-termination, labels: {app: lifecycle}}
spec:
  terminationGracePeriodSeconds: 10
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "trap 'echo received SIGTERM; sleep 5; echo shutdown-complete; exit 0' TERM; while true; do sleep 1; done"]
