apiVersion: apps/v1
kind: Deployment
metadata: {name: gitops-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: gitops-web}}
  template:
    metadata: {labels: {app: gitops-web}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports: [{containerPort: 80}]
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: gitops-web}
spec:
  selector: {app: gitops-web}
  ports: [{port: 80, targetPort: 80}]
