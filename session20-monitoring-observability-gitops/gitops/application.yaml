apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: session20-web, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/Json604/devops-heros.git
    targetRevision: submission/kartikey-10121
    path: session20-monitoring-observability-gitops/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-lab
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
