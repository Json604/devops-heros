name: Sessions 17 and 21 - Helpdesk DevSecOps
on:
  push:
    branches: [main, 'submission/**']
    paths:
      - 'session21-final-devops-project/**'
      - 'session-17-devsecops/**'
      - '.github/workflows/helpdesk.yml'
  pull_request:
    paths:
      - 'session21-final-devops-project/**'
      - 'session-17-devsecops/**'
      - '.github/workflows/helpdesk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helpdesk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install backend dependencies
        run: pip install -r session21-final-devops-project/application/backend/requirements-dev.txt
      - name: Unit and API tests
        run: pytest -v session21-final-devops-project/application/backend/tests --junitxml=test-results.xml
      - name: SAST - Bandit
        run: bandit -r session21-final-devops-project/application/backend/app -ll
      - name: SCA - Python
        run: pip-audit -r session21-final-devops-project/application/backend/requirements.txt
      - name: Frontend build and dependency audit
        working-directory: session21-final-devops-project/application/frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Secret scan - Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo/session21-final-devops-project --redact --no-banner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helpdesk-test-results
          path: test-results.xml
  build-scan-deploy:
    needs: test-and-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: |
          docker build -t campus-helpdesk-backend:${{ github.sha }} session21-final-devops-project/application/backend
          docker build -t campus-helpdesk-frontend:${{ github.sha }} session21-final-devops-project/application/frontend
      - name: Container security gates
        run: |
          mkdir -p reports
          for component in backend frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" aquasec/trivy:0.75.0 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output /reports/$component.json campus-helpdesk-$component:${{ github.sha }}
          done
      - name: Publish SHA-tagged images to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          for component in backend frontend; do
            docker tag campus-helpdesk-$component:${{ github.sha }} ghcr.io/$owner/campus-helpdesk-$component:${{ github.sha }}
            docker push ghcr.io/$owner/campus-helpdesk-$component:${{ github.sha }}
          done
      - uses: helm/kind-action@v1
        with: {cluster_name: helpdesk-ci}
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.19.0}
      - name: Deploy and verify Kubernetes
        run: |
          kind load docker-image campus-helpdesk-backend:${{ github.sha }} campus-helpdesk-frontend:${{ github.sha }} --name helpdesk-ci
          bash session21-final-devops-project/scripts/create-secret.sh helpdesk
          helm upgrade --install helpdesk session21-final-devops-project/helm/helpdesk -n helpdesk --set backend.tag=${{ github.sha }} --set frontend.tag=${{ github.sha }} --set hpa.enabled=false --set ingress.enabled=false --wait --wait-for-jobs --timeout 300s
          kubectl get pods,svc,pvc -n helpdesk
          kubectl run smoke -n helpdesk --image=curlimages/curl:8.17.0 --restart=Never --command -- sh -ec 'curl --fail --retry 10 --retry-delay 3 http://backend:8000/ready; curl --fail http://frontend:8080; curl --fail -X POST -H "Content-Type: application/json" -d "{\"title\":\"CI deployment verification\"}" http://backend:8000/api/tickets'
          kubectl wait -n helpdesk --for=jsonpath='{.status.phase}'=Succeeded pod/smoke --timeout=120s
          kubectl logs -n helpdesk smoke
      - name: Publish GitOps deployment values
        if: github.event_name != 'pull_request'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          printf 'backend:\n  image: ghcr.io/%s/campus-helpdesk-backend\n  tag: "%s"\nfrontend:\n  image: ghcr.io/%s/campus-helpdesk-frontend\n  tag: "%s"\n' "$owner" '${{ github.sha }}' "$owner" '${{ github.sha }}' > release-values.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helpdesk-security-and-release
          path: |
            reports/
            release-values.yaml
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -n helpdesk --sort-by=.lastTimestamp || true
          kubectl logs -n helpdesk -l app=helpdesk-backend --tail=50 || true
