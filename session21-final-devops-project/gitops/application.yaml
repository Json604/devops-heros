apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-helpdesk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Json604/devops-heros.git
    targetRevision: submission/kartikey-10121
    path: session21-final-devops-project/helm/helpdesk
    helm:
      releaseName: helpdesk
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: helpdesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
