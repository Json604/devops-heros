apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
  selector: {app: helpdesk-postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: helpdesk-postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: helpdesk-postgres}
  template:
    metadata:
      labels: {app: helpdesk-postgres}
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: postgres
        image: {{ .Values.postgres.image | quote }}
        envFrom: [{configMapRef: {name: helpdesk-config}}]
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: {{ .Values.postgres.existingSecret }}, key: password}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{containerPort: 5432}]
        readinessProbe:
          exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      {{- if .Values.postgres.storageClass }}
      storageClassName: {{ .Values.postgres.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgres.storage }}
