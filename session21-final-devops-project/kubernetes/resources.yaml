          httpGet: {path: /health, port: http}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
# Source: helpdesk/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: helpdesk-backend
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: helpdesk-backend}
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 60}
---
# Source: helpdesk/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: helpdesk-postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: helpdesk-postgres}
  template:
    metadata:
      labels: {app: helpdesk-postgres}
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: postgres
        image: "postgres:16-alpine"
        envFrom: [{configMapRef: {name: helpdesk-config}}]
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: helpdesk-database, key: password}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{containerPort: 5432}]
        readinessProbe:
          exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi
---
# Source: helpdesk/templates/migration.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: helpdesk-migrate-1
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: "campus-helpdesk-backend:local"
        imagePullPolicy: IfNotPresent
        command: [alembic, upgrade, head]
        envFrom: [{configMapRef: {name: helpdesk-config}}]
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: helpdesk-database, key: password}
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
---
# Source: helpdesk/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk
spec:
  ingressClassName: nginx
  rules:
  - host: helpdesk.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend: {service: {name: backend, port: {number: 8000}}}
      - path: /
        pathType: Prefix
        backend: {service: {name: frontend, port: {number: 8080}}}
