apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-config
data:
  APP_NAME: Campus Helpdesk API
  POSTGRES_HOST: postgres
  POSTGRES_DB: "helpdesk"
  POSTGRES_USER: "helpdesk"
---
# Source: helpdesk/templates/backend.yaml
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {app: helpdesk-backend}
spec:
  type: ClusterIP
  selector: {app: helpdesk-backend}
  ports: [{name: http, port: 8000, targetPort: http}]
---
# Source: helpdesk/templates/frontend.yaml
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app: helpdesk-frontend}
spec:
  type: ClusterIP
  selector: {app: helpdesk-frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# Source: helpdesk/templates/postgres.yaml
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
  selector: {app: helpdesk-postgres}
---
# Source: helpdesk/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-backend
spec:
  selector:
    matchLabels: {app: helpdesk-backend}
  template:
    metadata:
      labels: {app: helpdesk-backend}
      annotations:
        checksum/config: c28fe6ddf51877efa48ec6fba6712ad5a9d46b3de680f9d29f22ccd364eee2e6
    spec:
      containers:
      - name: backend
        image: "campus-helpdesk-backend:local"
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 8000}]
        envFrom: [{configMapRef: {name: helpdesk-config}}]
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: helpdesk-database, key: password}
        startupProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet: {path: /ready, port: http}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
