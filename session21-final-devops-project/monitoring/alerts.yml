groups:
- name: helpdesk
  rules:
  - alert: HelpdeskDown
    expr: up{job="helpdesk"} == 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: Helpdesk metrics endpoint is unavailable
  - alert: HelpdeskHighErrorRate
    expr: sum(rate(http_requests_total{job="helpdesk",status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{job="helpdesk"}[5m])),
      0.001) > 0.05
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: More than 5% of requests are failing
