# Short-lived coursework stack; access through loopback port-forwarding.
alertmanager:
  enabled: false
grafana:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 6h
    serviceMonitorSelector:
      matchLabels:
        release: monitoring
    serviceMonitorNamespaceSelector: {}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 768Mi}
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
