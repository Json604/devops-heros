apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helpdesk-prometheus
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helpdesk-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: helpdesk-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\nrule_files:\n- /etc/prometheus/alerts.yml\n\
    scrape_configs:\n- job_name: helpdesk\n  static_configs:\n  - targets:\n    -\
    \ backend.helpdesk.svc.cluster.local:8000\n- bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \  job_name: cadvisor\n  kubernetes_sd_configs:\n  - role: node\n  relabel_configs:\n\
    \  - replacement: kubernetes.default.svc:443\n    target_label: __address__\n\
    \  - replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor\n    source_labels:\n\
    \    - __meta_kubernetes_node_name\n    target_label: __metrics_path__\n  scheme:\
    \ https\n  tls_config:\n    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n"
  alerts.yml: "groups:\n- name: helpdesk\n  rules:\n  - alert: HelpdeskDown\n    annotations:\n\
    \      summary: Helpdesk metrics endpoint is unavailable\n    expr: up{job=\"\
    helpdesk\"} == 0\n    for: 30s\n    labels:\n      severity: critical\n  - alert:\
    \ HelpdeskHighErrorRate\n    annotations:\n      summary: More than 5% of requests\
    \ are failing\n    expr: sum(rate(http_requests_total{job=\"helpdesk\",status=~\"\
    5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{job=\"helpdesk\"}[5m])),\n\
    \      0.001) > 0.05\n    for: 2m\n    labels:\n      severity: warning\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yml: "apiVersion: 1\ndatasources:\n- access: proxy\n  isDefault: true\n\
    \  name: Prometheus\n  type: prometheus\n  uid: prometheus\n  url: http://prometheus:9090\n"
  dashboard.yml: "apiVersion: 1\nproviders:\n- name: helpdesk\n  options:\n    path:\
    \ /var/lib/grafana/dashboards\n  type: file\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
data:
  dashboard.json: '{"uid": "campus-helpdesk", "title": "Campus Helpdesk - Kartikey
    24bcs10121", "schemaVersion": 39, "version": 1, "refresh": "10s", "time": {"from":
    "now-15m", "to": "now"}, "panels": [{"id": 1, "type": "timeseries", "title": "Request
    rate", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr":
    "sum(rate(http_requests_total{job=\"helpdesk\"}[5m]))", "refId": "A"}], "fieldConfig":
    {"defaults": {"unit": "reqps"}}, "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}},
    {"id": 2, "type": "timeseries", "title": "HTTP requests", "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(http_requests_total{job=\"helpdesk\"})",
    "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short"}}, "gridPos": {"x":
    12, "y": 0, "w": 12, "h": 8}}, {"id": 3, "type": "timeseries", "title": "CPU cores",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr":
    "sum(rate(container_cpu_usage_seconds_total{namespace=\"helpdesk\",container!=\"\",container!=\"POD\"}[5m]))",
    "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short"}}, "gridPos": {"x":
    0, "y": 8, "w": 12, "h": 8}}, {"id": 4, "type": "timeseries", "title": "Memory
    usage", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"expr": "sum(container_memory_working_set_bytes{namespace=\"helpdesk\",container!=\"\",container!=\"POD\"})",
    "refId": "A"}], "fieldConfig": {"defaults": {"unit": "bytes"}}, "gridPos": {"x":
    12, "y": 8, "w": 12, "h": 8}}, {"id": 5, "type": "timeseries", "title": "Application
    health", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"expr": "up{job=\"helpdesk\"}", "refId": "A"}], "fieldConfig": {"defaults":
    {"unit": "short"}}, "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8}}]}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.7.3
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      serviceAccountName: prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:12.4.1
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: 'true'
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
        volumeMounts:
        - name: provisioning
          mountPath: /etc/grafana/provisioning/datasources/datasource.yml
          subPath: datasource.yml
        - name: provisioning
          mountPath: /etc/grafana/provisioning/dashboards/dashboard.yml
          subPath: dashboard.yml
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: provisioning
        configMap:
          name: grafana-provisioning
      - name: dashboards
        configMap:
          name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
